<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1a1621"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#d2e560"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d2e560" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d2e560" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Glow accents -->
  <circle cx="150" cy="80" r="220" fill="url(#glow1)"/>
  <circle cx="1080" cy="340" r="260" fill="url(#glow2)"/>

  <!-- Top gradient border -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#lineGrad)"/>

  <!-- Status dot + eyebrow -->
  <circle cx="90" cy="120" r="6" fill="#d2e560"/>
  <text x="108" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#d2e560" font-weight="600">FULL-STACK DEVELOPER PORTFOLIO</text>

  <!-- Name -->
  <text x="86" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#nameGrad)">Md Moniruzzaman</text>

  <!-- Tagline -->
  <text x="88" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#cccccc">Building scalable web applications and REST APIs with the MERN stack</text>

  <!-- Tech pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">
    <rect x="88" y="270" width="98" height="34" rx="17" fill="#1c1c22" stroke="#333333"/>
    <text x="112" y="292" fill="#dddddd">MongoDB</text>

    <rect x="196" y="270" width="88" height="34" rx="17" fill="#1c1c22" stroke="#333333"/>
    <text x="218" y="292" fill="#dddddd">Express</text>

    <rect x="294" y="270" width="72" height="34" rx="17" fill="#1c1c22" stroke="#333333"/>
    <text x="313" y="292" fill="#dddddd">React</text>

    <rect x="376" y="270" width="80" height="34" rx="17" fill="#1c1c22" stroke="#333333"/>
    <text x="396" y="292" fill="#dddddd">Node.js</text>

    <rect x="466" y="270" width="98" height="34" rx="17" fill="rgba(192,132,252,0.12)" stroke="#c084fc"/>
    <text x="486" y="292" fill="#c084fc">Socket.IO</text>
  </g>

  <!-- Decorative cube (isometric) representing the 3D skills cube -->
  <g transform="translate(980,110)">
    <polygon points="80,0 160,45 80,90 0,45" fill="#2a2a33" stroke="#3a3a45"/>
    <polygon points="80,90 160,45 160,135 80,180" fill="#1c1c22" stroke="#3a3a45"/>
    <polygon points="0,45 80,90 80,180 0,135" fill="#232329" stroke="#3a3a45"/>
    <polygon points="80,0 160,45 80,90 0,45" fill="url(#glow1)" opacity="0.5"/>
  </g>

  <!-- Bottom location tag -->
  <text x="88" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#888888">📍 Dortmund, Germany  ·  MERN Stack  ·  Render + Vercel + MongoDB Atlas</text>
</svg>
